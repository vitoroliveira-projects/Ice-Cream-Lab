    <script>
      // Ensure window.fetch is configurable / writable so polyfills or scripts can safely assign to it
      (function() {
        try {
          var currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            writable: true,
            value: currentFetch
          });
        } catch (e) {
          // If already defined with only a getter, redefine getter/setter
          try {
            var originalDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
            var fetchVal = window.fetch;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() { return fetchVal; },
              set: function(v) { fetchVal = v; }
            });
          } catch (err) {}
        }
      })();
    </script>
