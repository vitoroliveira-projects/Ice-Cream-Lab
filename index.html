    <script>
      // Fix for "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var activeFetch = window.fetch;

          function ensureSetter(target) {
            if (!target) return;
            try {
              var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
              if (desc && (desc.configurable || desc.set === undefined)) {
                Object.defineProperty(target, 'fetch', {
                  configurable: true,
                  enumerable: desc.enumerable !== undefined ? desc.enumerable : true,
                  get: function() { return activeFetch; },
                  set: function(fn) { activeFetch = fn; }
                });
              }
            } catch (e) {}
          }

          // Walk prototype chain of window
          var curr = window;
          while (curr) {
            ensureSetter(curr);
            try {
              curr = Object.getPrototypeOf(curr);
            } catch (e) {
              break;
            }
          }

          if (typeof Window !== 'undefined' && Window.prototype) {
            ensureSetter(Window.prototype);
          }

          // Directly ensure window has a getter and setter
          try {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() { return activeFetch; },
              set: function(fn) { activeFetch = fn; }
            });
          } catch (e) {}
        } catch (err) {}

        // Global error suppression for this specific benign browser/iframe quirk
        window.addEventListener('error', function(e) {
          if (e && e.message && e.message.indexOf('fetch') !== -1 && e.message.indexOf('getter') !== -1) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
